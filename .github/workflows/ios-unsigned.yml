name: Build iOS IPA (unsigned, for sideloading)

# Builds a real native iPhone app package (.ipa) on GitHub's free macOS runner.
# The app source comes from smartshift-source.zip committed at the repo root.
# The IPA is UNSIGNED on purpose: SideStore/AltStore signs it on-device with
# the user's free Apple ID at install time (no paid Apple Developer account).
# The finished IPA is pushed to the `builds` branch for download.
#
# NOTE: Capacitor 8 scaffolds the iOS project with Swift Package Manager
# (no Podfile, no .xcworkspace), so there is intentionally no `pod install`
# step and xcodebuild uses -project instead of -workspace.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack app source
        run: |
          test -f smartshift-source.zip || (echo "smartshift-source.zip missing" && exit 1)
          mkdir -p src && unzip -q smartshift-source.zip -d src
          ls src | head

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd src && bun install

      - name: Build web app
        run: cd src && bun run build

      - name: Scaffold native iOS project
        run: |
          cd src && bunx cap add ios
          test -d ios/App/App.xcodeproj || (echo "iOS scaffold failed: App.xcodeproj missing" && exit 1)

      - name: Sync web assets into iOS project
        run: cd src && bunx cap sync ios

      - name: Resolve Swift packages
        run: cd src/ios/App && xcodebuild -project App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Build unsigned archive
        run: |
          cd src/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          APP_DIR="src/ios/App/build/App.xcarchive/Products/Applications"
          mkdir -p "$APP_DIR/Payload"
          cp -R "$APP_DIR/App.app" "$APP_DIR/Payload/"
          cd "$APP_DIR"
          zip -qr "$GITHUB_WORKSPACE/SmartShift-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/SmartShift-unsigned.ipa"

      - name: Publish IPA to builds branch
        run: |
          IPA="$GITHUB_WORKSPACE/SmartShift-unsigned.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf -q .
          test -f "$IPA" || (echo "IPA not found at $IPA" && exit 1)
          git add SmartShift-unsigned.ipa
          git commit -q -m "iOS build #$GITHUB_RUN_NUMBER"
          git push -f origin builds
